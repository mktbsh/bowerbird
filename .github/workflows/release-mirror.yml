# Copies a release from the private source repository into this public one.
#
# Install in the public repository (XBLOB_RELEASE_REPO, mktbsh/bowerbird) as
# .github/workflows/release-mirror.yml. scripts/release.sh in the source repository starts it with
#   gh workflow run release-mirror.yml --repo <public repo> -f tag=v<YYYY.M.D[.N]>
#
# Secret SOURCE_REPO_TOKEN: a fine-grained personal access token limited to the source repository,
# with "Contents: Read-only". Nothing else.
name: Mirror release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag in the source repository (vYYYY.M.D or vYYYY.M.D.N)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      SOURCE_REPO: mktbsh/xblob
      TAG: ${{ inputs.tag }}
    steps:
      - name: Check the tag
        run: |
          printf '%s' "$TAG" | grep -Eq '^v[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}(\.[0-9]+)?$' || { echo "Not a release tag: $TAG" >&2; exit 1; }

      - name: Download from the source repository
        env:
          GH_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
        run: |
          version=${TAG#v}
          mkdir dist
          gh release download "$TAG" --repo "$SOURCE_REPO" --pattern "Bowerbird-$version.zip" --dir dist
          gh release view "$TAG" --repo "$SOURCE_REPO" --json body --jq .body > dist/notes.md
          test -s "dist/Bowerbird-$version.zip"

      - name: Publish here
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${TAG#v}
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG is already published."
            exit 0
          fi
          gh release create "$TAG" "dist/Bowerbird-$version.zip" --repo "$GITHUB_REPOSITORY" \
            --title "Bowerbird $version" --notes-file dist/notes.md
